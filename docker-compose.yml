version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: pagesmi_db
    environment:
      POSTGRES_DB: pagesmi
      POSTGRES_USER: pagesmi_user
      POSTGRES_PASSWORD: pagesmi_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  postgres_data:
